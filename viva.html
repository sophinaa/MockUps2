<title>Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed app shell. Compact icon rail left, thin top bar, one focused view at a time.
   Exam room is a 60/40 split: evidence (code) left, conversation right. Single deliberate dark look. */
:root{
  color-scheme: dark;
  --bg:#121417; --panel:#181b1f; --panel-2:#1e2227; --raised:#252a30; --line:#2a2f36; --line-2:#383f48;
  --fg:#e8ebef; --fg-2:#b7bfc9; --muted:#8c95a1; --faint:#5f6874;
  --teal:#45cfb6; --teal-bg:rgba(69,207,182,.11); --teal-line:rgba(69,207,182,.38);
  --amber:#f1b25e; --amber-bg:rgba(241,178,94,.11); --amber-line:rgba(241,178,94,.42);
  --red:#f37a76; --red-bg:rgba(243,122,118,.11); --red-line:rgba(243,122,118,.42);
  --blue:#7ea8ff; --blue-bg:rgba(126,168,255,.11); --blue-line:rgba(126,168,255,.4);
  --slate:#a9b3c2; --slate-bg:rgba(169,179,194,.09);
  --add-bg:rgba(120,200,140,.075); --add-fg:#93cf9f; --del-bg:rgba(214,130,150,.075); --del-fg:#d797a6;
  --hl:#e8ebef; --hl-bg:rgba(232,235,239,.055);
  --focus:#a9c6ff;
  --p1:#7fb7ff; --p2:#c3a0ff; --p3:#bad86e; --p4:#ff9fc8;
  --f-ui:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --r:8px; --r-sm:5px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;flex:none}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;width:44px;flex:none}
.brand svg{width:22px;height:22px}
.repo{display:flex;align-items:center;gap:14px;min-width:0;color:var(--fg-2);font-size:13px}
.repo span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.repo .ic{color:var(--muted)}
.top .spacer{flex:1}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-2);white-space:nowrap}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px var(--teal-bg)}
.conn.down .dot{background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
.conn.retrying .dot{background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.conn button{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#121417;flex:none}
.demo-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px dashed var(--line-2);padding:5px 9px;border-radius:999px}
.demo-btn:hover{color:var(--fg)}
.demo-menu{position:absolute;right:16px;top:56px;width:290px;background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r);padding:8px;z-index:40;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.demo-menu h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px 8px;font-weight:600}
.demo-menu button{display:flex;width:100%;text-align:left;gap:10px;align-items:flex-start;padding:8px;border-radius:6px;font-size:13px}
.demo-menu button:hover{background:var(--panel-2)}
.demo-menu small{display:block;color:var(--muted);font-size:12px}
.demo-menu .on{color:var(--amber)}

.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px;padding:10px 8px}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:var(--r);color:var(--muted);font-size:10.5px;font-weight:500;line-height:1.2;text-align:center}
.nav .ic{width:19px;height:19px}
.nav:hover{color:var(--fg);background:var(--panel-2)}
.nav[aria-current="page"]{color:var(--fg);background:var(--raised)}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--fg)}
.nav .badge{position:absolute;top:6px;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#121417;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.nav .badge.red{background:var(--red)}
.side .foot{margin-top:auto;font-size:10px;color:var(--faint);text-align:center;line-height:1.3}

main{overflow:auto;min-width:0;position:relative}
.view{padding:24px 28px 40px;max-width:1440px;margin:0 auto}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-size:22px;letter-spacing:-.015em}
.view-head h1:focus{outline:none}
.sub{color:var(--muted);margin-top:4px;max-width:62ch}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* ---------- shared bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:7px;font-weight:600;font-size:13.5px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--raised);border-color:#4a525d}
.btn.primary{background:var(--fg);color:#121417;border-color:var(--fg)}
.btn.primary:hover{background:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--fg)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill.teal{color:var(--teal);border-color:var(--teal-line);background:var(--teal-bg)}
.pill.amber{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.pill.red{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.pill.blue{color:var(--blue);border-color:var(--blue-line);background:var(--blue-bg)}
.pill.slate{color:var(--slate);border-color:var(--line-2);background:var(--slate-bg)}
.sim{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);border:1px dashed var(--line-2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;padding:2px;background:var(--panel)}
.seg button{height:28px;padding:0 12px;border-radius:5px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);min-width:0;width:260px}
.search .ic{color:var(--muted)}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:13px}
.search:focus-within{border-color:var(--focus)}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat .k{display:flex;align-items:center;gap:7px;color:var(--fg-2);font-size:12.5px}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:0}
.stat .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--teal);border-radius:2px;transition:width .8s}
.t-teal{color:var(--teal)} .t-amber{color:var(--amber)} .t-red{color:var(--red)} .t-blue{color:var(--blue)} .t-muted{color:var(--muted)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed .ic{margin-top:2px}
.feed time{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.feed li.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--raised)}to{background:transparent}}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:var(--raised);border:1px solid var(--line-2);padding:10px 14px;border-radius:var(--r);font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:flex;gap:9px;align-items:center;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.skel{background:linear-gradient(90deg,var(--panel-2),var(--raised),var(--panel-2));background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:6px}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px;color:var(--fg-2)}
.empty .ic{width:28px;height:28px;color:var(--muted)}
.empty h3{font-size:15px;color:var(--fg)}
.empty p{max-width:44ch;color:var(--muted)}

/* ---------- overview ---------- */
.ov-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.tagline{font-family:var(--f-display);font-size:38px;line-height:1.08;font-weight:400;letter-spacing:-.01em;text-wrap:balance}
.tagline em{color:var(--amber);font-style:italic}
.ov-intro{padding:26px 26px 24px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.ov-intro p{color:var(--fg-2);max-width:56ch}
.paused{padding:20px 22px;display:flex;flex-direction:column;gap:12px;border-color:var(--amber-line)}
.paused .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paused h2{font-size:17px}
.paused .meta{color:var(--muted);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
.paused blockquote{margin:0;padding:10px 12px;background:var(--panel-2);border-radius:6px;border-left:2px solid var(--amber);font-size:13px;color:var(--fg-2)}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.ov-grid .card{padding:18px 20px}
.ov-grid h2{font-size:14px;margin-bottom:12px}
.mod-row{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:12px;align-items:center;padding:8px 0;font-size:13px}
.mod-row .mono{color:var(--fg-2)}
.mod-bar{height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--line) 0 4px,var(--panel-2) 4px 8px);overflow:hidden;display:flex}
.mod-bar i{display:block;height:100%}
.mod-row .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg-2)}

/* ---------- map ---------- */
.map-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.stage{position:relative;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 1.5px) 0 0/18px 18px,var(--bg);min-height:480px}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.module{border:1px solid var(--line);border-radius:var(--r);background:rgba(24,27,31,.85);padding:10px;display:flex;flex-direction:column;gap:8px}
.module-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 4px 4px;position:relative;z-index:3}
.module-h b{font-size:13px;font-weight:600}
.module-h span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.node{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;text-align:left;padding:9px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);transition:border-color .2s,opacity .2s,transform .2s}
.node:hover,.node:focus-visible{z-index:4;border-color:var(--line-2);transform:translateY(-1px)}
.node.match{z-index:4;border-color:var(--focus)}
.node.dim{opacity:.35}
.node[aria-pressed="true"]{z-index:4;border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.node .nt{display:flex;align-items:center;gap:6px;min-width:0}
.node .fn{font-family:var(--f-mono);font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.node .dir{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .flags{margin-left:auto;display:flex;gap:4px;flex:none}
.flag{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px}
.flag .ic{width:12px;height:12px}
.flag.amber{color:var(--amber);background:var(--amber-bg)} .flag.red{color:var(--red);background:var(--red-bg)} .flag.slate{color:var(--slate);background:var(--slate-bg)}
.syms{display:flex;flex-wrap:wrap;gap:4px}
.sym{font-family:var(--f-mono);font-size:10.5px;color:var(--fg-2);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:17px}
.sym.match{border-color:var(--focus);color:var(--fg)}
.who{display:flex;gap:4px;align-items:center;min-height:16px}
.who .d{width:16px;height:16px;border-radius:50%;font-size:8px;font-weight:700;display:grid;place-items:center;color:#121417}
.who .d.stale{background:transparent!important;border:1.5px dashed currentColor;color:inherit}
.who .none{font-size:11px;color:var(--muted)}
.node[data-state="clear"]{border-color:var(--line-2)}
.node[data-state="clear"]::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--c,var(--teal))}
#fog{position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:var(--r)}
.map-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.map-side .card{padding:16px}
.map-side h2{font-size:13px;margin-bottom:10px}
.legend{display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--fg-2)}
.legend .li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.sw{height:20px;border-radius:4px;border:1px solid var(--line-2)}
.sw.fog{background:repeating-radial-gradient(circle at 30% 40%,rgba(170,182,198,.55),rgba(170,182,198,.3) 6px,rgba(170,182,198,.5) 11px)}
.sw.thin{background:linear-gradient(90deg,rgba(170,182,198,.28),rgba(170,182,198,.12))}
.sw.clear{background:var(--panel-2);border-color:var(--teal-line);box-shadow:inset 2px 0 0 var(--teal)}
.legend .people{display:flex;flex-wrap:wrap;gap:6px 12px}
.legend .people span{display:inline-flex;align-items:center;gap:6px}
.legend .people i{width:10px;height:10px;border-radius:50%}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);cursor:pointer}
.toggle input{accent-color:var(--teal);width:15px;height:15px}
.detail{display:flex;flex-direction:column;gap:14px}
.detail .hd{display:flex;align-items:flex-start;gap:8px}
.detail .hd h2{font-family:var(--f-mono);font-size:14px;font-weight:600;margin:0;word-break:break-all}
.detail .hd .btn{margin-left:auto}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.people-list{display:flex;flex-direction:column;gap:6px}
.people-list div{display:flex;align-items:center;gap:8px}
.callout{padding:10px 12px;border-radius:6px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.callout.amber{background:var(--amber-bg);color:var(--fg);border:1px solid var(--amber-line)}
.callout.red{background:var(--red-bg);border:1px solid var(--red-line)}
.callout.teal{background:var(--teal-bg);border:1px solid var(--teal-line)}
.callout.slate{background:var(--slate-bg);border:1px solid var(--line-2)}
.callout .ic{margin-top:2px}
.callout.amber .ic{color:var(--amber)} .callout.red .ic{color:var(--red)} .callout.teal .ic{color:var(--teal)}

/* ---------- exam ---------- */
.exam{display:flex;flex-direction:column;height:100%;min-height:0}
.exam-head{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.exam-head h1{font-size:18px;letter-spacing:-.01em}
.exam-head .meta{display:flex;gap:14px;color:var(--fg-2);font-size:12.5px;flex-wrap:wrap}
.exam-head .meta span{display:inline-flex;align-items:center;gap:6px}
.exam-head .meta .ic{color:var(--muted);width:14px;height:14px}
.exam-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mtabs{display:none}
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
.pane-code{border-right:1px solid var(--line);padding:16px 18px 16px 24px;gap:12px;overflow:hidden}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:12px 14px;align-items:start}
.req q{font-size:15px;font-weight:500;quotes:"\201C" "\201D"}
.req .by{color:var(--muted);font-size:12px;margin-top:3px}
.origins{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ob{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);padding:3px 8px 3px 4px;border-radius:5px;border:1px solid var(--line)}
.ob b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.olet{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--f-mono);flex:none}
.olet.R{background:var(--blue);color:#121417}
.olet.I{background:transparent;color:var(--slate);border:1.5px dashed var(--slate)}
.olet.S{background:var(--amber);color:#121417}
.codebox{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.ftabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.ftab{display:flex;align-items:center;gap:7px;padding:0 14px;height:38px;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;position:relative}
.ftab[aria-selected="true"]{color:var(--fg);background:var(--panel-2)}
.ftab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fg)}
.ftab .cnt{display:inline-flex;gap:3px}
.ftab .cnt i{width:6px;height:6px;border-radius:2px}

      ${!S.agent ? `<button class="btn primary" id="sendAgent">${ic("send")}Send reasoning to agent</button>` : S.agent === "ready" ? `<button class="btn primary" id="newReview">${ic("mic")}Start new review</button>` : ""}
      <button class="btn" id="reviewCode">${ic("code")}Review code</button>
      <button class="btn ghost" id="skipFromResult">Skip with debt</button>

  </div>`;
}
function axes(c1, v1, d1, c2, v2, d2, c3, v3, d3) {
  return `<div class="axes">
    <section class="card axis"><span class="eyebrow"><span>Your understanding</span></span><b class="t-${c1 === "slate" ? "muted" : c1}">${ic(c1 === "teal" ? "check" : c1 === "blue" ? "eye" : "debt")}${v1}</b><p>${d1}</p></section>
    <section class="card axis"><span class="eyebrow"><span>The code</span></span><b class="t-${c2 === "slate" ? "muted" : c2}">${ic(c2 === "teal" ? "shieldCheck" : c2 === "red" ? "alert" : "info")}${v2}</b><p>${d2}</p></section>
    <section class="card axis"><span class="eyebrow"><span>Push</span></span><b class="t-${c3}">${ic(c3 === "teal" ? "unlock" : c3 === "red" ? "lock" : "debt")}${v3}</b><p>${d3}</p></section></div>`;
}
function agentHTML() {
  const a = S.agent, step = { sending: 1, working: 2, ready: 4 }[a];
  const li = (n, text) => `<li class="${step > n ? "done" : ""}">${step > n ? ic("check") : step === n ? '<span class="spin" aria-hidden="true"></span>' : ic("clock")}<span>${text}</span></li>`;
  return `<section class="card agent" aria-live="polite"><div class="hd"><h3>Coding agent</h3><span class="sim">${ic("bolt")}Simulated agent</span>${a === "ready" ? `<span class="pill slate" style="margin-left:auto">${ic("fog")}Fog returned on src/webhook.ts</span>` : ""}</div>
    <ol>${li(1, "Reasoning sent with lines 37–45")}${li(2, "Agent is writing a fix")}${li(3, 'Fix committed as <span class="mono">c81d4e7</span>: check the key before charging, pass it to the provider')}</ol>
    ${a === "ready" ? `<p class="t-muted" style="font-size:12.5px">The code changed, so your earlier understanding needs a refresh. A short second review clears the fog and unblocks the push.</p>` : ""}</section>`;
}
async function sendToAgent() {
  S.agent = "sending"; refreshExamBits(); await sleep(1000);
  S.agent = "working"; refreshExamBits(); await sleep(2200);
  S.agent = "ready"; S.fixed = true;
  const w = F("webhook"); w.problem = false; w.who.sophina = "stale"; if (w.who.marcus) w.who.marcus = "stale";
  w.change = { kind: "requested", text: "Agent applied your fix: check the key before charging and pass it to the provider.", when: "just now", commit: "c81d4e7" };
  ACTIVITY.unshift({ k: "amber", i: "bolt", h: 'Agent changed <span class="mono">processPayment</span> using your reasoning. Understanding needs review.', t: "just now", fresh: true });
  S.push = "paused"; renderNav(); refreshExamBits();
  const hp = $("#pushPill"); if (hp) hp.innerHTML = pushPill();
  toast("bolt", "Fix ready in c81d4e7. Start a new review to clear the fog.");
  const nb = $("#newReview"); nb && nb.focus();
}

/* ================= ledger ================= */
function ledgerRows() {
  if (S.ledgerEmpty) return [];
  const q = S.ledgerQ.trim().toLowerCase();
  return LEDGER.filter(r => {
    const f = F(r.f);
    if (q && !(PEOPLE[r.p].name.toLowerCase().includes(q) || r.sym.toLowerCase().includes(q) || f.path.toLowerCase().includes(q) || r.ex.toLowerCase().includes(q))) return false;
    if (S.ledgerFilter === "refresh") return r.st === "refresh" || r.st === "partial";
    if (S.ledgerFilter === "debt") return r.st === "debt";
    if (S.ledgerFilter === "changed") return !!r.chg;
    return true;
  });
}
function viewLedger() {
  const counts = { all: LEDGER.length, refresh: LEDGER.filter(r => r.st === "refresh" || r.st === "partial").length, debt: LEDGER.filter(r => r.st === "debt").length, changed: LEDGER.filter(r => r.chg).length };
  if (S.ledgerEmpty) Object.keys(counts).forEach(k => counts[k] = 0);
  const chips = [["all", "All"], ["refresh", "Needs refresh"], ["debt", "Understanding debt"], ["changed", "Changed since review"]];
  return `<div class="view">
    <div class="view-head"><div><span class="eyebrow">Shared record</span><h1>Understanding ledger</h1><p class="sub">Who has explained which code, when, and in their own words. A record needs a refresh when the code changes or the review is over 90 days old.</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><div class="seg" role="group" aria-label="Group records"><button data-lgroup="person" aria-pressed="${S.ledgerGroup === "person"}">By person</button><button data-lgroup="symbol" aria-pressed="${S.ledgerGroup === "symbol"}">By file</button></div></div></div>
    <div class="ledger-tools">
      <label class="search">${ic("search")}<span class="sr">Search the ledger</span><input id="ledgerSearch" type="search" placeholder="Person, file, function or words" value="${esc(S.ledgerQ)}" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
      <div class="chips" role="group" aria-label="Filter records">${chips.map(([k, l]) => `<button class="chip" data-lfilter="${k}" aria-pressed="${S.ledgerFilter === k}">${l} <b>${counts[k]}</b></button>`).join("")}</div>
    </div>
    <div class="ledger-body" id="ledgerBody">${ledgerBody()}</div></div>`;
}
function ledgerBody() {
  if (!S.ledgerLoaded) return `<div class="tablewrap" aria-busy="true" style="padding:14px;display:flex;flex-direction:column;gap:10px">${'<div class="skel" style="height:38px"></div>'.repeat(7)}</div><div class="card ledger-detail"><div class="skel" style="height:20px;width:60%"></div><div class="skel" style="height:120px"></div></div>`;
  if (S.ledgerEmpty) return `<div class="card" style="grid-column:1/-1"><div class="empty">${ic("ledger")}<h3>No understanding recorded yet</h3><p>Records appear here after someone finishes a Viva review. Each one keeps the explanation, the transcript and the code it was about.</p><a class="btn primary" href="#exam">${ic("mic")}Start a review</a></div></div>`;
  const rows = ledgerRows();
  if (!rows.length) return `<div class="card" style="grid-column:1/-1"><div class="empty">${ic("search")}<h3>No records match${S.ledgerQ ? ` “${esc(S.ledgerQ)}”` : " this filter"}</h3><p>Try a person's name, a function such as createCharge, or clear the filters.</p><button class="btn sm" id="ledgerClear">Clear search and filters</button></div></div>`;
  if (!rows.find(r => r.id === S.ledgerSel)) S.ledgerSel = rows[0].id;
  const keyOf = r => S.ledgerGroup === "person" ? r.p : r.f;
  const groups = [...new Set(rows.map(keyOf))];
  const body = groups.map(g => {
    const label = S.ledgerGroup === "person" ? `<span class="pp">${av(g, 18)}${PEOPLE[g].name}</span>` : `<span class="mono">${esc(F(g).path)}</span>`;
    return `<tr class="grp"><td colspan="6">${label}</td></tr>` + rows.filter(r => keyOf(r) === g).map(rowHTML).join("");
  }).join("");
  const sel = LEDGER.find(r => r.id === S.ledgerSel);
  return `<div class="tablewrap"><table aria-label="Understanding records">
      <thead><tr><th scope="col">Person</th><th scope="col">File / function</th><th scope="col">Status</th><th scope="col">Last reviewed</th><th scope="col">Changed since</th><th scope="col">Saved reasoning</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <aside class="card ledger-detail" id="ledgerDetail" aria-label="Record details">${ledgerDetail(sel)}</aside>`;
}
function rowHTML(r) {
  const f = F(r.f), s = STATUS[r.st];
  return `<tr class="rec" tabindex="0" data-rec="${r.id}" aria-selected="${r.id === S.ledgerSel}">
    <td><span class="pp">${av(r.p, 22)}${PEOPLE[r.p].short}</span></td>
    <td><div class="sy">${esc(r.sym)}</div><div class="pa">${esc(f.path)}</div></td>
    <td><span class="pill ${s.cls}">${ic(s.i)}${s.l}</span></td>
    <td class="num">${fmtDate(r.d)}<div class="pa">${ago(r.d)}${r.age ? " · over 90 days" : ""}</div></td>
    <td>${r.chg ? `<span class="chg t-amber">${ic("alert")}Yes</span><div class="pa">${r.chg.c} · ${r.chg.when}</div>` : `<span class="chg t-muted">No</span>`}</td>
    <td><span class="ex">${esc(r.ex)}</span></td></tr>`;
}
function ledgerDetail(r) {
  if (!r) return "";
  const f = F(r.f), s = STATUS[r.st];
  return `<div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap"><div><span class="eyebrow">${esc(f.path)}</span><h2>${esc(r.sym)}</h2></div><span class="pill ${s.cls}">${ic(s.i)}${s.l}</span></div>
    <div style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg-2)">${av(r.p, 22)}${PEOPLE[r.p].name} · reviewed ${fmtDate(r.d)} (${ago(r.d)})</div>
    ${r.why ? `<div class="callout ${r.st === "debt" ? "amber" : "slate"}">${ic(r.chg ? "alert" : r.st === "debt" ? "debt" : "clock")}<span>${esc(r.why)}</span></div>` : ""}
    <div><h3>Explanation</h3><p class="exp">${esc(r.ex)}</p></div>
    <div><h3>Transcript</h3><div class="transcript" style="border:0;padding:0;min-height:0">${r.tr.map(([w, t]) => `<div class="tl ${w === "Examiner" || w === "Viva" ? "" : "you"}"><span class="spk">${esc(w.split(" ")[0])}</span><span class="txt">${esc(t)}</span></div>`).join("")}</div></div>
    <div><h3>Linked code</h3><div class="mini-code" tabindex="0" role="region" aria-label="Linked code">${r.code[1].map((l, i) => `<div><span>${r.code[0] + i}</span><span>${hl(l) || " "}</span></div>`).join("")}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${r.st === "refresh" || r.st === "debt" || r.st === "partial" ? (r.f === "webhook" && S.push !== "allowed" ? `<a class="btn primary sm" href="#exam">${ic("refresh")}Refresh understanding</a>` : `<button class="btn primary sm" data-queue="${r.f}">${ic("refresh")}Request a refresh</button>`) : ""}
      <button class="btn sm" data-open-node="${r.f}">${ic("map")}Show on map</button></div>`;
}
function mountLedger() {
  if (!S.ledgerLoaded) setTimeout(() => { S.ledgerLoaded = true; if (S.view === "ledger") { $("#ledgerBody").innerHTML = ledgerBody(); } }, 700);
}
function refreshLedger(focusSearch) {
  const b = $("#ledgerBody"); if (b) b.innerHTML = ledgerBody();
  if (focusSearch) return;
}

/* ================= events ================= */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, a, tr.rec, .ln.grp"); if (!t) { if (S.demoOpen && !ev.target.closest("#demoMenu")) setDemo(false); return; }
  const e = E();
  if (t.id === "demoBtn") { setDemo(!S.demoOpen); return; }
  if (S.demoOpen && !t.closest("#demoMenu")) setDemo(false);
  if (t.dataset.demo) { demoAction(t.dataset.demo); return; }
  if (t.id === "connRetry" || t.dataset.retryConn !== undefined) { retryConn(); return; }
  // map
  if (t.dataset.mode) { S.mapMode = t.dataset.mode; refreshMap(); return; }
  if (t.classList.contains("node")) { S.sel = S.sel === t.dataset.id ? null : t.dataset.id; refreshMap(t.dataset.id); return; }
  if (t.id === "closeDetail") { const id = S.sel; S.sel = null; refreshMap(id); return; }
  if (t.id === "clearSearch") { S.mapQuery = ""; refreshMap(); $("#mapSearch").focus(); return; }
  if (t.dataset.openNode) { S.sel = t.dataset.openNode; S.mapQuery = ""; if (location.hash === "#map") render(false); else location.hash = "map"; return; }
  if (t.dataset.queue) { toast("check", `Added ${F(t.dataset.queue).path} to the team's review queue.`); return; }
  if (t.dataset.ledgerFile) { const r = LEDGER.find(x => x.f === t.dataset.ledgerFile); if (r) S.ledgerSel = r.id; return; }
  // ledger
  if (t.dataset.lfilter) { S.ledgerFilter = t.dataset.lfilter; $$(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.lfilter === S.ledgerFilter))); refreshLedger(); return; }
  if (t.dataset.lgroup) { S.ledgerGroup = t.dataset.lgroup; $$("[data-lgroup]").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.lgroup === S.ledgerGroup))); refreshLedger(); return; }
  if (t.matches("tr.rec")) { selectRec(t.dataset.rec); return; }
  if (t.id === "ledgerClear") { S.ledgerQ = ""; S.ledgerFilter = "all"; render(false); return; }
  // exam: code
  if (t.dataset.mtab) { e.tab = t.dataset.mtab; $(".split").dataset.tab = e.tab; $$("[data-mtab]").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.mtab === e.tab)); b.setAttribute("aria-selected", String(b.dataset.mtab === e.tab)); }); if (e.tab === "code") applyFocus(true); return; }
  if (t.dataset.file) { e.file = t.dataset.file; rerenderCode(); return; }
  if (t.dataset.fileJump) { e.file = t.dataset.fileJump; rerenderCode(); applyFocus(true); return; }
  if (t.dataset.group) { selectGroup(t.dataset.group); return; }
  if (t.matches(".ln.grp")) { selectGroup(t.dataset.g); return; }
  if (t.id === "evClose") { selectGroup(e.group); return; }
  if (t.id === "jumpFocus") { applyFocus(true); return; }
  if (t.dataset.lines) { const [a, b] = t.dataset.lines.split("-").map(Number); setFocus([a, b]); if (matchMedia("(max-width:980px)").matches) { e.tab = "code"; $(".split").dataset.tab = "code"; applyFocus(true); } return; }
  // exam: flow
  if (t.id === "startVoice") { if (S.mic === "prompt") { e.phase = "perm"; e.pendingStart = true; renderQ(); $("#permAllow").focus(); } else beginExam("voice"); return; }
  if (t.id === "startTyped") { beginExam("typed").then(() => { const a = $("#answer"); a && a.focus(); }); e.mode = "typed"; return; }
  if (t.id === "permAllow") { S.mic = "granted"; toast("mic", "Microphone allowed (simulated)."); if (e.pendingStart || !e.started) { e.pendingStart = false; beginExam("voice"); } else { e.phase = "ready"; e.mode = "voice"; renderQ(); startListening(); } return; }
  if (t.id === "permDeny") { e.pendingStart = false; if (!e.started) beginExam("typed").then(() => { const a = $("#answer"); a && a.focus(); }); else { e.phase = "ready"; e.mode = "typed"; renderQ(); $("#answer").focus(); } return; }
  if (t.id === "micBtn") { if (e.phase === "listening") stopListening(); else startListening(); return; }
  if (t.id === "muteBtn") { e.muted = !e.muted; if (e.muted) hush(); t.setAttribute("aria-pressed", String(e.muted)); t.innerHTML = ic(e.muted ? "volOff" : "vol"); t.setAttribute("aria-label", e.muted ? "Unmute examiner voice" : "Mute examiner voice"); toast(e.muted ? "volOff" : "vol", e.muted ? "Examiner voice muted. Captions continue." : "Examiner voice on."); return; }
  if (t.id === "typeBtn") { if (e.phase === "listening") { micState = null; e.phase = "ready"; } e.mode = "typed"; renderQ(); $("#answer").focus(); return; }
  if (t.id === "voiceBtn") { e.mode = "voice"; renderQ(); $("#micBtn") && $("#micBtn").focus(); return; }
  if (t.id === "sendBtn") { submitAnswer($("#answer").value, "typed"); return; }
  if (t.id === "sampleBtn") { const q = currentQ(); const a = $("#answer"); a.value = e.follow ? (q.sampleFollow || q.typedSample || q.sample) : (q.typedSample || q.sample); e.draft = a.value; a.focus(); return; }
  if (t.id === "skipBtn") { e.skipConfirm = true; const s = $(".skip"); s.outerHTML = skipHTML(); $("#skipYes").focus(); return; }
  if (t.id === "skipCancel") { e.skipConfirm = false; $(".skip").outerHTML = skipHTML(); $("#skipBtn").focus(); return; }
  if (t.id === "skipYes" || t.id === "skipFromResult") { FLOW++; micState = null; applyResult("skipped"); return; }
  // results
  if (t.id === "sendAgent") { sendToAgent(); return; }
  if (t.id === "newReview") { S.exam = freshExam(2); S.agent = null; render(false); const b = $("#startVoice:not([disabled])") || $("#startTyped"); b && b.focus(); return; }
  if (t.id === "reviewCode") { e.resultView = "code"; e.focus = [38, 44]; e.tab = "code"; render(false); return; }
  if (t.id === "backToResult") { e.resultView = "summary"; render(false); return; }
  if (t.id === "toMap") { S.sel = "webhook"; S.mapMode = "me"; location.hash = "map"; setTimeout(() => toast("check", "Fog clearing on src/webhook.ts and 2 related files."), 300); return; }
  if (t.id === "reviewLater") { S.sel = "webhook"; location.hash = "map"; toast("clock", "Kept in your review queue. The fog stays until it's reviewed."); return; }
  if (t.id === "reviewNow") { const r = S.fixed ? 2 : 1; S.exam = freshExam(r); render(false); return; }
});
function selectRec(id) {
  S.ledgerSel = id;
  $$("tr.rec").forEach(r => r.setAttribute("aria-selected", String(r.dataset.rec === id)));
  const d = $("#ledgerDetail"); if (d) d.innerHTML = ledgerDetail(LEDGER.find(r => r.id === id));
  if (matchMedia("(max-width:1180px)").matches && d) d.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}
document.addEventListener("input", ev => {
  if (ev.target.id === "mapSearch") { S.mapQuery = ev.target.value; refreshMap(); }
  if (ev.target.id === "ledgerSearch") { S.ledgerQ = ev.target.value; refreshLedger(); }
  if (ev.target.id === "answer") E().draft = ev.target.value;
});
document.addEventListener("change", ev => { if (ev.target.id === "fogToggle") { S.fogOn = ev.target.checked; fogDirty = true; drawFog(); } });
document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase(); const typing = tag === "input" || tag === "textarea";
  if (ev.key === "Escape") {
    if (S.demoOpen) { setDemo(false); $("#demoBtn").focus(); return; }
    if (S.view === "map" && S.sel) { const id = S.sel; S.sel = null; refreshMap(id); return; }
    if (S.view === "exam" && E().skipConfirm) { E().skipConfirm = false; $(".skip").outerHTML = skipHTML(); return; }
    if (S.view === "exam" && E().group) { selectGroup(E().group); return; }
  }
  if (ev.key === "/" && !typing) { const s = $("#mapSearch") || $("#ledgerSearch"); if (s) { ev.preventDefault(); s.focus(); } }
  if (ev.target.id === "answer" && ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); const b = $("#sendBtn"); if (b && !b.disabled) submitAnswer(ev.target.value, "typed"); }
  if (ev.target.matches && ev.target.matches("tr.rec") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); selectRec(ev.target.dataset.rec); }
  if (ev.target.matches && ev.target.matches("tr.rec") && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
    ev.preventDefault(); const rows = $$("tr.rec"); const i = rows.indexOf(ev.target); const n = rows[i + (ev.key === "ArrowDown" ? 1 : -1)]; if (n) { n.focus(); selectRec(n.dataset.rec); }
  }
  if (ev.target.classList && ev.target.classList.contains("ftab") && (ev.key === "ArrowRight" || ev.key === "ArrowLeft")) {
    const tabs = $$(".ftab"); const i = tabs.indexOf(ev.target); const n = tabs[(i + (ev.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length]; n.focus(); n.click();
  }
  if (S.demoOpen && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
    const items = $$("#demoMenu button"); const i = items.indexOf(document.activeElement); ev.preventDefault();
    items[(i + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
  }
});

/* ----- demo menu ----- */
function demoAction(a) {
  setDemo(false);
  if (a === "conn") { if (S.conn === "ok") { S.conn = "down"; if (E().phase === "listening") { micState = null; FLOW++; E().phase = "ready"; } toast("wifiOff", "Simulated: local service unreachable."); } else S.conn = "ok"; renderConn(); refreshExamBits(); }
  if (a === "mic") { S.mic = S.mic === "denied" ? "prompt" : "denied"; if (S.mic === "denied" && E().started && E().phase !== "result") { if (E().phase === "listening") { micState = null; E().phase = "ready"; } E().mode = "typed"; } refreshExamBits(); toast(S.mic === "denied" ? "micOff" : "mic", S.mic === "denied" ? "Simulated: microphone blocked by the browser." : "Microphone unblocked. Viva will ask again."); }
  if (a === "mic-reset") { S.mic = "prompt"; refreshExamBits(); toast("mic", "Viva will ask for the microphone next time."); }
  if (a === "loading") { S.mapLoaded = false; S.ledgerLoaded = false; render(false); }
  if (a === "empty") { S.ledgerEmpty = !S.ledgerEmpty; if (S.view === "ledger") render(false); else location.hash = "ledger"; }
  if (a === "reset") { location.reload(); }
}

/* ================= boot ================= */
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { if (S.view === "map") measureFog(); });
route();
document.fonts && document.fonts.ready.then(() => { if (S.view === "map") measureFog(); });
})();
</script>
